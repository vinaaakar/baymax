[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baymax-backend"
version = "0.1.0"
description = "BAYMAX local-first AI companion backend (orchestration, tools, protocol server)"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "cryptography>=42",
  "numpy>=1.26",
  "truststore>=0.9",  # verify outbound TLS against the macOS system trust store
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
macos = ["pyobjc-framework-Quartz>=10; sys_platform == 'darwin'", "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'", "pyobjc-framework-Vision>=10; sys_platform == 'darwin'"]

[project.scripts]
baymax = "baymax.__main__:main"

[tool.setuptools.packages.find]
include = ["baymax*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
